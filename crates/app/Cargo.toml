[package]
name = "review-monitor"
version.workspace = true
edition.workspace = true
publish = false
description = "美团 / 大众点评 差评监控"

[dependencies]
rm-core = { path = "../core" }
anyhow.workspace = true
chrono.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
slint = { version = "1.18", features = ["raw-window-handle-06"] }
wry = "0.57"
tray-icon = "0.26"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Registry"] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"
